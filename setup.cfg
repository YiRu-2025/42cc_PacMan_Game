[flake8]
max-line-length = 88
extend-ignore = E203
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    vendor,
    tests
   [flake8]

[mypy]
strict = True
exclude = (?x)(^vendor/|^build/|^dist/|^\.venv/|^tests/)

[mypy-mazegenerator.*]
ignore_missing_imports = True
follow_imports = skip

[tool:pytest]
testpaths = tests
